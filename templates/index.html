<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <div class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Machine Learning • Flask • Python</p>
          <h1>Estimate a home price in seconds</h1>
          <p>
            Enter the size, number of bedrooms, and age of the property to get a
            real-time prediction from a trained regression model.
          </p>
        </div>

        <form id="prediction-form" class="prediction-form">
          <label for="area">Area (sq ft)</label>
          <input id="area" name="area" type="number" min="500" step="1" required />

          <label for="bedrooms">Bedrooms</label>
          <input id="bedrooms" name="bedrooms" type="number" min="1" step="1" required />

          <label for="age">Age (years)</label>
          <input id="age" name="age" type="number" min="0" step="1" required />

          <label for="region">Market region</label>
          <select id="region" name="region" required>
            <option value="North America">North America</option>
            <option value="Europe">Europe</option>
            <option value="Asia">Asia</option>
            <option value="Latin America">Latin America</option>
            <option value="Africa">Africa</option>
            <option value="Oceania">Oceania</option>
          </select>

          <button type="submit">Predict Price</button>
        </form>

        <div id="result" class="result-box" aria-live="polite">
          Fill the form to see your estimate.
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('prediction-form');
      const resultBox = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          area: Number(document.getElementById('area').value),
          bedrooms: Number(document.getElementById('bedrooms').value),
          age: Number(document.getElementById('age').value),
          region: document.getElementById('region').value,
        };

        resultBox.textContent = 'Predicting...';

        try {
          const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Prediction failed.');
          }

          resultBox.innerHTML = `<strong>${data.prediction}</strong> estimated value`;
        } catch (error) {
          resultBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
