name: Daily Activity Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update daily activity file
        run: |
          echo "Daily activity generated by GitHub Actions on $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> activity-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-log.txt
          git commit -m "chore: daily activity update" || echo "No changes to commit"
          git push origin HEAD:main
